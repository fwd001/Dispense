<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="本地文件型配置 / 文本 / 文件下发平台：一个应用一个永久链接，上传不等于发布。">
  <meta name="color-scheme" content="light">
  <title>配置下发器</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="shell header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◍</span>
        <div class="brand-text">
          <h1>配置下发器</h1>
          <p class="tagline">上传 ≠ 发布 · 一个应用 = 一个永久链接</p>
        </div>
      </div>
      <nav class="site-nav" aria-label="主导航">
        <a href="#/apps" data-nav="apps">应用</a>
        <a href="#/trash" data-nav="trash">回收站<span class="nav-badge" id="trashBadge" hidden></span></a>
      </nav>
    </div>
  </header>

  <main class="shell" id="main">
    <div id="view" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="shell">
      <p>数据全部存放在服务器本地 <code>data/</code> 目录 · 删除先进回收站，7 天后自动清理</p>
    </div>
  </footer>

  <!-- 通用弹层：确认 / 编辑 -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal">
      <h2 class="modal-title" id="modalTitle">标题</h2>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

  <script src="/app.js"></script>
</body>
</html>
